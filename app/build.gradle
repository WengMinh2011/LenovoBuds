plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lenovobuds.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lenovobuds.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.0-alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
