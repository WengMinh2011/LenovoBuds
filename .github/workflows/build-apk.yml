name: Build LenovoBuds ALPHA APK

on:
  push:
    branches: [ main, master, 'fix/gm2-pro-discovery-ui', 'fix/crash-and-responsive-ui', 'release/v0.1.1-alpha-clean-ui' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build ALPHA debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LenovoBuds-v0.1.1-alpha-build-${GITHUB_RUN_NUMBER}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LenovoBuds-v0.1.1-alpha-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/LenovoBuds-v0.1.1-alpha-build-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub ALPHA pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.1-alpha.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "app/build/outputs/apk/debug/LenovoBuds-v0.1.1-alpha-build-${GITHUB_RUN_NUMBER}.apk#LenovoBuds-v0.1.1-alpha-build-${GITHUB_RUN_NUMBER}.apk" --title "LenovoBuds ALPHA 0.1.1 (build ${GITHUB_RUN_NUMBER})" --notes "Experimental LenovoBuds Android build. This ALPHA contains an editable phone-side EQ and game profiles. GM2 Pro/LE258 earbud Game/Music, ANC and Ambient commands are not verified and are not claimed to work." --prerelease --target "$GITHUB_SHA"
